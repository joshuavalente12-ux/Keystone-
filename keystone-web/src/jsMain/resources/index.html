<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
<title>Keystone</title>
<style>
  html, body { margin: 0; height: 100%; background: #000; overflow: hidden; touch-action: none;
    font-family: system-ui, -apple-system, "Segoe UI", sans-serif; color: #eef0ff; user-select: none; }
  #gl, #ui { position: fixed; inset: 0; width: 100%; height: 100%; }
  #gl { display: block; }
  #status { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center;
    font-size: 18px; background: #0b0d1a; text-align: center; padding: 24px; z-index: 10; }
  #status.error { color: #ff8a9e; }
</style>
</head>
<body>
<canvas id="gl"></canvas>
<div id="ui"></div>
<div id="status">Loading Keystone…</div>
<script src="skiko.js"></script>
<script src="keystone.js"></script>
</body>
</html>
