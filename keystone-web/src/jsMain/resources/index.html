<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
<title>Keystone</title>
<style>
  html, body { margin: 0; height: 100%; background: #0b0d1a; overflow: hidden; touch-action: none;
    font-family: system-ui, -apple-system, "Segoe UI", sans-serif; color: #eef0ff; user-select: none; }
  #game { position: fixed; inset: 0; width: 100%; height: 100%; display: block; }
  #status { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center;
    flex-direction: column; gap: 12px; font-size: 18px; background: #0b0d1a; text-align: center; padding: 24px; }
  #status.error { color: #ff8a9e; }
  #bars { position: fixed; left: 16px; top: 16px; display: none; flex-direction: column; gap: 6px; width: 220px; pointer-events: none; }
  .bar { height: 10px; border-radius: 6px; background: rgba(0,0,0,.45); overflow: hidden; border: 1px solid rgba(255,255,255,.15); }
  .bar div { height: 100%; transition: width .15s; }
  #health { background: linear-gradient(90deg, #d83a4f, #ff6b7f); }
  #stamina { background: linear-gradient(90deg, #2fb59c, #5fe0c4); }
  #toast { position: fixed; left: 50%; top: 18%; transform: translateX(-50%); max-width: 80vw; padding: 10px 18px;
    border-radius: 10px; background: rgba(10,12,25,.7); font-size: 16px; text-align: center; opacity: 0;
    transition: opacity .4s; pointer-events: none; }
  #crosshair { position: fixed; left: 50%; top: 50%; width: 6px; height: 6px; margin: -3px 0 0 -3px; border-radius: 50%;
    background: rgba(255,255,255,.7); display: none; pointer-events: none; }
  body.playing #crosshair { display: block; }
  #help { position: fixed; right: 16px; bottom: 16px; font-size: 12px; line-height: 1.6; color: rgba(238,240,255,.75);
    background: rgba(10,12,25,.55); padding: 8px 12px; border-radius: 8px; pointer-events: none; display: none; }
  body.playing #help { display: block; }
  #touch { display: none; }
  @media (pointer: coarse) {
    #help { display: none !important; }
    body.playing #touch { display: flex; position: fixed; right: 16px; bottom: 20px; gap: 10px; flex-wrap: wrap; width: 180px; justify-content: flex-end; }
    #touch button { width: 76px; height: 56px; border-radius: 14px; border: 1px solid rgba(255,255,255,.25);
      background: rgba(10,12,25,.5); color: #fff; font-size: 14px; font-weight: 600; }
  }
</style>
</head>
<body>
<canvas id="game"></canvas>
<div id="status">Loading Keystone…</div>
<div id="bars">
  <div class="bar"><div id="health" style="width:100%"></div></div>
  <div class="bar"><div id="stamina" style="width:100%"></div></div>
</div>
<div id="crosshair"></div>
<div id="toast"></div>
<div id="help">Click to look around · WASD move · Shift run · Space jump<br>Left click attack · E use · V camera · 1-4 quick items</div>
<div id="touch">
  <button id="btn-use">Use</button><button id="btn-run">Run</button>
  <button id="btn-jump">Jump</button><button id="btn-attack">Attack</button>
</div>
<script src="keystone.js"></script>
</body>
</html>
